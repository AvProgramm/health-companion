services:
  - type: web
    name: health-companion-coach
    runtime: python
    plan: free
    branch: feat/ai-trainer
    autoDeployTrigger: off
    buildCommand: pip install -r services/coach/requirements.txt
    startCommand: python -m uvicorn coach.app:app --app-dir services/coach --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: COACH_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
