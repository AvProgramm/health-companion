# Runs the same checks as the Claude Code hook, independently of any local setup,
# because a local hook can be skipped or disabled.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: apps/web
      - name: Typecheck, app tests and hook tests
        run: node .claude/hooks/check-changed.mjs --all
